<svg xmlns="http://www.w3.org/2000/svg" width="1180" height="700" viewBox="0 0 1180 700" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" role="img" aria-label="工作台架构"><defs><marker id="a-cyan" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#38bdf8"/></marker><marker id="a-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#34d399"/></marker><marker id="a-amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#fbbf24"/></marker><marker id="a-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#f87171"/></marker><marker id="a-muted" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8b9bad"/></marker><marker id="a-violet" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#a78bfa"/></marker></defs><rect width="1180" height="700" fill="#0b0f14"/><text x="44" y="62" font-size="25" fill="#e6edf3" text-anchor="start" font-weight="700">工作台架构：一台机器当执行器，人只在两个闸口出现</text><text x="44" y="92" font-size="14.5" fill="#8b9bad" text-anchor="start" font-weight="400">浏览器只是客户端；内核、账本、worktree、模型调用全在这台机器上，代码和数据不出内网</text><rect x="360" y="128" width="460" height="92" rx="12" fill="#101821" stroke="#38bdf8" stroke-width="1.2"/><text x="590" y="160" font-size="17" fill="#38bdf8" text-anchor="middle" font-weight="600">人（浏览器打开一个地址）</text><text x="590" y="188" font-size="13.5" fill="#8b9bad" text-anchor="middle" font-weight="400">提交一句话任务 · 初筛 30 秒 · 终审要不要合</text><text x="590" y="210" font-size="13.5" fill="#8b9bad" text-anchor="middle" font-weight="400">lead / member / viewer 三种角色，一人一号</text><path d="M590,220 L590,268" fill="none" stroke="#8b9bad" stroke-width="1.6" marker-end="url(#a-cyan)"/><text x="604" y="250" font-size="12.5" fill="#38bdf8" text-anchor="start" font-weight="400">HTTP + 签名 cookie</text><rect x="240" y="270" width="700" height="104" rx="12" fill="#101821" stroke="#22303f" stroke-width="1.2"/><text x="262" y="302" font-size="17" fill="#e6edf3" text-anchor="start" font-weight="600">HTTP 服务</text><text x="262" y="326" font-size="13.5" fill="#8b9bad" text-anchor="start" font-weight="400">src/server · 登录与会话 · 权限矩阵（服务端判，不靠前端藏按钮）</text><text x="262" y="350" font-size="13.5" fill="#8b9bad" text-anchor="start" font-weight="400">两段评审 API · 活动流 · 静态界面 · /api/health 体检</text><path d="M590,374 L590,420" fill="none" stroke="#8b9bad" stroke-width="1.6" marker-end="url(#a-violet)"/><text x="604" y="402" font-size="12.5" fill="#a78bfa" text-anchor="start" font-weight="400">只 append，不改历史</text><rect x="240" y="422" width="700" height="104" rx="12" fill="#101821" stroke="#a78bfa" stroke-width="1.2"/><text x="262" y="454" font-size="17" fill="#a78bfa" text-anchor="start" font-weight="600">事件账本（唯一真源）</text><text x="262" y="478" font-size="13.5" fill="#8b9bad" text-anchor="start" font-weight="400">events 只追加 → tasks 是它的物化投影；kill -9 后重放，不失忆、不乱序</text><text x="262" y="502" font-size="13.5" fill="#8b9bad" text-anchor="start" font-weight="400">租约是单条 CAS UPDATE + pid 存活探测：两个 worker 抢不到同一个任务</text><path d="M430,526 L430,566" fill="none" stroke="#8b9bad" stroke-width="1.6" marker-end="url(#a-green)"/><text x="444" y="552" font-size="12.5" fill="#34d399" text-anchor="start" font-weight="400">领任务</text><path d="M760,526 L760,566" fill="none" stroke="#8b9bad" stroke-width="1.6" marker-end="url(#a-amber)"/><text x="774" y="552" font-size="12.5" fill="#fbbf24" text-anchor="start" font-weight="400">留证据</text><rect x="150" y="568" width="400" height="108" rx="12" fill="#101821" stroke="#34d399" stroke-width="1.2"/><text x="172" y="600" font-size="16" fill="#34d399" text-anchor="start" font-weight="600">worker（常驻，崩了自动拉起）</text><text x="172" y="624" font-size="13.5" fill="#8b9bad" text-anchor="start" font-weight="400">状态机 · 重试 ≤3 轮 · 预算熔断 · 体量分级</text><text x="172" y="648" font-size="13.5" fill="#8b9bad" text-anchor="start" font-weight="400">每次调用落 agent.started / heartbeat / finished</text><text x="172" y="668" font-size="12.5" fill="#8b9bad" text-anchor="start" font-weight="400">界面靠心跳分得清「模型在思考」和「worker 已死」</text><path d="M550,622 L606,622" fill="none" stroke="#8b9bad" stroke-width="1.6" marker-end="url(#a-green)"/><text x="578" y="612" font-size="12" fill="#34d399" text-anchor="middle" font-weight="400">每次一个独立进程</text><rect x="608" y="568" width="424" height="108" rx="12" fill="#101821" stroke="#38bdf8" stroke-width="1.2"/><text x="630" y="600" font-size="16" fill="#38bdf8" text-anchor="start" font-weight="600">agent provider（可换）</text><text x="630" y="624" font-size="13.5" fill="#8b9bad" text-anchor="start" font-weight="400">mock 确定性假引擎 / opencode 真模型</text><text x="630" y="648" font-size="13.5" fill="#8b9bad" text-anchor="start" font-weight="400">每角色一个进程：Verifier 拿不到 Coder 的上下文</text><text x="630" y="668" font-size="12.5" fill="#8b9bad" text-anchor="start" font-weight="400">在独立 git worktree 里改，主仓库只接受合并</text><rect x="150" y="686" width="882" height="0" rx="12" fill="none" stroke="none" stroke-width="1.2"/><text x="44" y="682" font-size="13" fill="#8b9bad" text-anchor="start" font-weight="400">四条不变量：账本只追加 · 单任务单 worker · 改动只在 worktree · 合并必须由人批准</text></svg>