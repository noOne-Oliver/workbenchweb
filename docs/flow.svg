<svg xmlns="http://www.w3.org/2000/svg" width="1180" height="620" viewBox="0 0 1180 620" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" role="img" aria-label="任务状态机"><defs><marker id="a-cyan" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#38bdf8"/></marker><marker id="a-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#34d399"/></marker><marker id="a-amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#fbbf24"/></marker><marker id="a-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#f87171"/></marker><marker id="a-muted" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8b9bad"/></marker><marker id="a-violet" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#a78bfa"/></marker></defs><rect width="1180" height="620" fill="#0b0f14"/><text x="44" y="58" font-size="25" fill="#e6edf3" text-anchor="start" font-weight="700">一个任务活多久：机器跑四段，人只卡两关</text><text x="44" y="88" font-size="14" fill="#8b9bad" text-anchor="start" font-weight="400">两段人工是显式状态，不是「awaiting_human + 一个字段」——账本重放一眼看出卡在哪一关，两段耗时也能分开统计</text><rect x="44" y="130" width="196" height="66" rx="12" fill="#101821" stroke="#8b9bad" stroke-width="1.2"/><text x="142" y="158" font-size="16" fill="#8b9bad" text-anchor="middle" font-weight="600">排队</text><text x="142" y="180" font-size="12" fill="#8b9bad" text-anchor="middle" font-weight="400" font-family="ui-monospace,SFMono-Regular,Menlo,monospace">queued</text><path d="M244,163 L294,163" fill="none" stroke="#8b9bad" stroke-width="1.6" marker-end="url(#a-#a78bfa)"/><rect x="300" y="130" width="196" height="66" rx="12" fill="#101821" stroke="#a78bfa" stroke-width="1.2"/><text x="398" y="158" font-size="16" fill="#a78bfa" text-anchor="middle" font-weight="600">规划</text><text x="398" y="180" font-size="12" fill="#8b9bad" text-anchor="middle" font-weight="400" font-family="ui-monospace,SFMono-Regular,Menlo,monospace">planning</text><path d="M500,163 L550,163" fill="none" stroke="#8b9bad" stroke-width="1.6" marker-end="url(#a-#34d399)"/><rect x="556" y="130" width="196" height="66" rx="12" fill="#101821" stroke="#34d399" stroke-width="1.2"/><text x="654" y="158" font-size="16" fill="#34d399" text-anchor="middle" font-weight="600">实现</text><text x="654" y="180" font-size="12" fill="#8b9bad" text-anchor="middle" font-weight="400" font-family="ui-monospace,SFMono-Regular,Menlo,monospace">implementing</text><path d="M756,163 L806,163" fill="none" stroke="#8b9bad" stroke-width="1.6" marker-end="url(#a-#38bdf8)"/><rect x="812" y="130" width="196" height="66" rx="12" fill="#101821" stroke="#38bdf8" stroke-width="1.2"/><text x="910" y="158" font-size="16" fill="#38bdf8" text-anchor="middle" font-weight="600">验收</text><text x="910" y="180" font-size="12" fill="#8b9bad" text-anchor="middle" font-weight="400" font-family="ui-monospace,SFMono-Regular,Menlo,monospace">verifying</text><path d="M910,200 L910,324" fill="none" stroke="#8b9bad" stroke-width="1.6" marker-end="url(#a-amber)"/><rect x="44" y="330" width="196" height="66" rx="12" fill="#1d1a10" stroke="#fbbf24" stroke-width="1.8"/><text x="142" y="358" font-size="16" fill="#fbbf24" text-anchor="middle" font-weight="600">初筛（人）</text><text x="142" y="380" font-size="12" fill="#8b9bad" text-anchor="middle" font-weight="400" font-family="ui-monospace,SFMono-Regular,Menlo,monospace">awaiting_review</text><path d="M244,363 L294,363" fill="none" stroke="#8b9bad" stroke-width="1.6" marker-end="url(#a-#fbbf24)"/><rect x="300" y="330" width="196" height="66" rx="12" fill="#1d1a10" stroke="#fbbf24" stroke-width="1.8"/><text x="398" y="358" font-size="16" fill="#fbbf24" text-anchor="middle" font-weight="600">终审（人）</text><text x="398" y="380" font-size="12" fill="#8b9bad" text-anchor="middle" font-weight="400" font-family="ui-monospace,SFMono-Regular,Menlo,monospace">awaiting_approval</text><path d="M500,363 L550,363" fill="none" stroke="#8b9bad" stroke-width="1.6" marker-end="url(#a-#fbbf24)"/><rect x="556" y="330" width="196" height="66" rx="12" fill="#101821" stroke="#a78bfa" stroke-width="1.2"/><text x="654" y="358" font-size="16" fill="#a78bfa" text-anchor="middle" font-weight="600">合并</text><text x="654" y="380" font-size="12" fill="#8b9bad" text-anchor="middle" font-weight="400" font-family="ui-monospace,SFMono-Regular,Menlo,monospace">merging</text><path d="M756,363 L806,363" fill="none" stroke="#8b9bad" stroke-width="1.6" marker-end="url(#a-#a78bfa)"/><rect x="812" y="330" width="196" height="66" rx="12" fill="#101821" stroke="#34d399" stroke-width="1.2"/><text x="910" y="358" font-size="16" fill="#34d399" text-anchor="middle" font-weight="600">完成</text><text x="910" y="380" font-size="12" fill="#8b9bad" text-anchor="middle" font-weight="400" font-family="ui-monospace,SFMono-Regular,Menlo,monospace">done</text><text x="142" y="312" font-size="12.5" fill="#fbbf24" text-anchor="middle" font-weight="600">人闸 1</text><text x="398" y="312" font-size="12.5" fill="#fbbf24" text-anchor="middle" font-weight="600">人闸 2</text><path d="M42,363 L22,363 L22,163 L42,163" fill="none" stroke="#8b9bad" stroke-width="1.6" stroke-dasharray="7 6" marker-end="url(#a-red)"/><text x="546" y="432" font-size="12.5" fill="#f87171" text-anchor="end" font-weight="400">打回（必须写理由）→ 重置 worktree → 重做，人的原话排在下轮提示词第一行</text><path d="M852,200 C852,242 686,242 686,200" fill="none" stroke="#8b9bad" stroke-width="1.6" stroke-dasharray="7 6" marker-end="url(#a-red)"/><text x="802" y="230" font-size="12.5" fill="#f87171" text-anchor="end" font-weight="400">护栏 / Verifier 没过：自动重试（≤3 轮）</text><rect x="556" y="460" width="300" height="74" rx="12" fill="#1b1114" stroke="#f87171" stroke-width="1.2" stroke-dasharray="6 5"/><text x="706" y="488" font-size="15" fill="#f87171" text-anchor="middle" font-weight="600">blocked 机器认输</text><text x="706" y="512" font-size="12" fill="#8b9bad" text-anchor="middle" font-weight="400">重试耗尽 · 预算熔断 · 权限被拒（确定性失败不重试）</text><path d="M978,200 L978,496 L862,496" fill="none" stroke="#8b9bad" stroke-width="1.6" stroke-dasharray="7 6" marker-end="url(#a-red)"/><text x="990" y="292" font-size="12" fill="#f87171" text-anchor="start" font-weight="400">重试耗尽</text><text x="44" y="598" font-size="13" fill="#8b9bad" text-anchor="start" font-weight="400">只有 awaiting_review / awaiting_approval 会停住等人；其余状态里人可以不看，因为系统会自己重试、自己升级、自己记完</text></svg>