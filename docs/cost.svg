<svg xmlns="http://www.w3.org/2000/svg" width="1180" height="470" viewBox="0 0 1180 470" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" role="img" aria-label="成本对比"><defs><marker id="a-cyan" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#38bdf8"/></marker><marker id="a-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#34d399"/></marker><marker id="a-amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#fbbf24"/></marker><marker id="a-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#f87171"/></marker><marker id="a-muted" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8b9bad"/></marker><marker id="a-violet" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#a78bfa"/></marker></defs><rect width="1180" height="470" fill="#0b0f14"/><text x="44" y="58" font-size="25" fill="#e6edf3" text-anchor="start" font-weight="700">同样一套 5 个任务，砍掉多余编排之后</text><text x="44" y="88" font-size="14" fill="#8b9bad" text-anchor="start" font-weight="400">真引擎实跑（opencode + deepseek-v4.1-flash），单位：token / 单任务平均</text><text x="60" y="130" font-size="16" fill="#e6edf3" text-anchor="start" font-weight="600">① 编排成本：5 次调用 → 2 次调用</text><rect x="80" y="208" width="110" height="172" rx="6" fill="#f87171" opacity="0.85"/><text x="135" y="196" font-size="15" fill="#f87171" text-anchor="middle" font-weight="700">482,743</text><text x="135" y="402" font-size="12.5" fill="#8b9bad" text-anchor="middle" font-weight="400">旧：5 次调用</text><rect x="240" y="298" width="110" height="82" rx="6" fill="#34d399" opacity="0.85"/><text x="295" y="286" font-size="15" fill="#34d399" text-anchor="middle" font-weight="700">230,630</text><text x="295" y="402" font-size="12.5" fill="#8b9bad" text-anchor="middle" font-weight="400">新：2 次调用</text><text x="190" y="300" font-size="34" fill="#34d399" text-anchor="middle" font-weight="700">-52.2%</text><path d="M60,380 L400,380" fill="none" stroke="#22303f" stroke-width="1"/><text x="470" y="130" font-size="16" fill="#e6edf3" text-anchor="start" font-weight="600">② 不同体量各花多少（同一个真实套件）</text><rect x="500" y="305" width="92" height="75" rx="6" fill="#38bdf8" opacity="0.85"/><text x="546" y="293" font-size="15" fill="#38bdf8" text-anchor="middle" font-weight="700">21 万</text><text x="546" y="402" font-size="12.5" fill="#8b9bad" text-anchor="middle" font-weight="400">small 改一处</text><rect x="636" y="196" width="92" height="184" rx="6" fill="#fbbf24" opacity="0.85"/><text x="682" y="184" font-size="15" fill="#fbbf24" text-anchor="middle" font-weight="700">51 万</text><text x="682" y="402" font-size="12.5" fill="#8b9bad" text-anchor="middle" font-weight="400">normal 多文件</text><rect x="772" y="158" width="92" height="222" rx="6" fill="#a78bfa" opacity="0.85"/><text x="818" y="146" font-size="15" fill="#a78bfa" text-anchor="middle" font-weight="700">62 万</text><text x="818" y="402" font-size="12.5" fill="#8b9bad" text-anchor="middle" font-weight="400">large 重构</text><path d="M480,380 L950,380" fill="none" stroke="#22303f" stroke-width="1"/><text x="60" y="432" font-size="12.5" fill="#8b9bad" text-anchor="start" font-weight="400">贵的地方不是提示词长度（每次 prompt 只有几百到几千字），是「调用次数 × 每次自带的工具往返」——所以省钱只能靠少调几次。</text><text x="44" y="454" font-size="12" fill="#8b9bad" text-anchor="start" font-weight="400">报告：docs/bench-real-2026-11-22T13-25-24-476Z.json（6 单混跑：small/normal/large 各走各的路径 + 一次确定性降级）</text></svg>